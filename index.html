<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rove &amp; Co.</title>
</head>

<!--Two columns in email is one row with two cells. That is it, and the result renders identically in Apple Mail and in Outlook.

The catch is what happens when one column holds more text than the other. Without valign="top" the shorter column floats to the vertical middle and the layout looks broken, so you will set the alignment before adding any content and then watch it hold.-->
<body style="margin:0; padding:0; background-color:#f2f4f6;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" style="padding:24px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; margin:0 auto; background-color:#ffffff;">
          <tr>
            <td style="padding:32px 24px 8px; font-family:Arial, 'Helvetica Neue', Helvetica, sans-serif; font-size:20px; font-weight:bold; color:#1b1f24;">Two ways to pack</td>
          </tr>

          <tr>
            <td width="300" valign="top" style="padding:24px 16px;">
              <h3 style="margin:0 0 8px; font-size:16px; color:#1b1f24;">
                The weekender
              </h3>

              <p style="margin:0; font-size:14px; line-height:1.6; color:#6b7280;">
                One bag, two days.
              </p>

            </td>
             <td width="300" valign="top" style="padding:24px 16px;">
              <h3 style="margin:0 0 8px; font-size:16px; color:#1b1f24;">
                The long haul
              </h3>
              <p style="margin:0; font-size:14px; line-height:1.6; color:#6b7280;">
                Built for three weeks of travel, with a separate boot compartment and a rain cover that actually stays on. 
              </p>
              
            </td>
         </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>
